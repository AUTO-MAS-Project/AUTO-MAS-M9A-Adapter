[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-m9a-adapter"
version = "0.3.2"
description = "M9A specialized script adapter for AUTO-MAS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:m9a_adapter"]
# 三方依赖（httpx、numpy、opencv-python、pillow）宿主都有，不在这里写。
# 直接导入两块库与专项共用库，写次版本上限；三块服务插件（agent 环境、运行、项目更新）只经服务调用、不导入它们的模块，只写下限。
# 编辑面板与恢复池要求宿主 SDK 提供三层编辑块和首账号引导声明。
dependencies = [
    "auto-mas-core>=5.9.0b1,<6",
    "auto-mas-maafw-interface>=0.3.1,<0.4",
    "auto-mas-maafw-native>=0.3.0,<0.4",
    "auto-mas-maafw-agent-env>=0.3.0",
    "auto-mas-maafw-runner>=0.3.0",
    "auto-mas-maafw-project-update>=0.3.0",
    "auto-mas-maafw-adapter-kit>=0.3.1,<0.4",
]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-M9A-Adapter/blob/master/CHANGELOG.md"
Documentation = "https://github.com/AUTO-MAS-Project/AUTO-MAS-M9A-Adapter/blob/master/README.md"
Homepage = "https://auto-mas.top"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-M9A-Adapter"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-M9A-Adapter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m9a_adapter = ["py.typed", "login_assets/*.png", "ui/*", "ui/**/*", "i18n/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["m9a_adapter"]
known-third-party = ["app", "auto_mas_core", "maafw_adapter_kit", "maafw_interface", "maafw_native"]
